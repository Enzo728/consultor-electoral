[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#141A22"
textColor = "#E8EEF7"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
